version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: medguard-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medguard-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: medguard-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage


  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: medguard-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: medguard-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper


  api-gateway:
    build: .
    container_name: medguard-api-gateway
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/medguard
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      KAFKA_BROKERS: kafka:9092
      GEMINI_API_KEYS: ${GEMINI_API_KEYS}
      GEMINI_MODELS: ${GEMINI_MODELS}
      MEDGEMMA_TUNNEL_URL: ${MEDGEMMA_TUNNEL_URL}
      MEDGEMMA_MODEL_NAME: ${MEDGEMMA_MODEL_NAME}
      MEDGEMMA_API_KEY: ${MEDGEMMA_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_MIN: ${JWT_EXPIRY_MIN}
      MAX_SESSION_TURNS: ${MAX_SESSION_TURNS}
      SEMANTIC_CACHE_THRESHOLD: ${SEMANTIC_CACHE_THRESHOLD}
      REPORT_CONFIDENCE_THRESHOLD: ${REPORT_CONFIDENCE_THRESHOLD}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN}

    depends_on:
      - postgres
      - redis
      - qdrant
      - kafka


  audit-consumer:
    build: .
    container_name: medguard-audit-consumer
    command: python -m app.services.audit_consumer
    environment:
      KAFKA_BROKERS: kafka:9092
    volumes:
      - audit_data:/app/data/cold_store
    depends_on:
      - kafka


  medgemma-worker:
    build: .
    container_name: medguard-medgemma-worker
    command: python -m app.services.medgemma_worker
    environment:
      KAFKA_BROKERS: kafka:9092
      MEDGEMMA_TUNNEL_URL: ${MEDGEMMA_TUNNEL_URL}
      MEDGEMMA_MODEL_NAME: ${MEDGEMMA_MODEL_NAME}
      MEDGEMMA_API_KEY: ${MEDGEMMA_API_KEY}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS}
      GEMINI_MODELS: ${GEMINI_MODELS}

    depends_on:
      - kafka


volumes:
  postgres_data:
  qdrant_data:
  audit_data:
