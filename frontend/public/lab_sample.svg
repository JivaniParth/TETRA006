<svg width="400" height="280" viewBox="0 0 400 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="280" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Document Header -->
  <rect x="25" y="25" width="350" height="35" rx="6" fill="#1E293B"/>
  <text x="40" y="47" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="700">CLINICAL LABORATORY TEST REPORT</text>
  <text x="290" y="47" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="700">VERIFIED</text>

  <!-- Section 1: Patient Info -->
  <line x1="25" y1="80" x2="375" y2="80" stroke="#334155"/>
  <text x="25" y="100" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">PARAMETER</text>
  <text x="180" y="100" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">RESULT</text>
  <text x="290" y="100" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">REF RANGE</text>

  <!-- Row 1: Glucose -->
  <rect x="25" y="115" width="350" height="35" rx="6" fill="#1E293B"/>
  <text x="35" y="137" fill="#F8FAFC" font-family="sans-serif" font-size="11">Fasting Blood Glucose</text>
  <text x="180" y="137" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="700">98 mg/dL</text>
  <text x="290" y="137" fill="#94A3B8" font-family="sans-serif" font-size="11">70 - 99 mg/dL</text>

  <!-- Row 2: Creatinine -->
  <rect x="25" y="160" width="350" height="35" rx="6" fill="#1E293B"/>
  <text x="35" y="182" fill="#F8FAFC" font-family="sans-serif" font-size="11">Serum Creatinine</text>
  <text x="180" y="182" fill="#0EA5E9" font-family="sans-serif" font-size="12" font-weight="700">0.9 mg/dL</text>
  <text x="290" y="182" fill="#94A3B8" font-family="sans-serif" font-size="11">0.7 - 1.3 mg/dL</text>

  <!-- Row 3: Total Cholesterol -->
  <rect x="25" y="205" width="350" height="35" rx="6" fill="#1E293B"/>
  <text x="35" y="227" fill="#F8FAFC" font-family="sans-serif" font-size="11">Total Cholesterol</text>
  <text x="180" y="227" fill="#F59E0B" font-family="sans-serif" font-size="12" font-weight="700">185 mg/dL</text>
  <text x="290" y="227" fill="#94A3B8" font-family="sans-serif" font-size="11">&lt; 200 mg/dL</text>

  <text x="25" y="260" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="600">✓ OCR Extracted Metrics Auto-Populated</text>
</svg>
