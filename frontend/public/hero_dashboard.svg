<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="20" y="20" width="560" height="40" rx="8" fill="#1E293B"/>
  <circle cx="45" cy="40" r="6" fill="#EF4444"/>
  <circle cx="65" cy="40" r="6" fill="#F59E0B"/>
  <circle cx="85" cy="40" r="6" fill="#10B981"/>
  <text x="110" y="45" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600">MedGuard AI Telemetry &amp; Clinical Indicators</text>

  <!-- Metric Card 1: BP -->
  <rect x="20" y="80" width="170" height="100" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="35" y="105" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">BLOOD PRESSURE</text>
  <text x="35" y="140" fill="#10B981" font-family="sans-serif" font-size="22" font-weight="800">120/80</text>
  <text x="35" y="162" fill="#94A3B8" font-family="sans-serif" font-size="10">mmHg (Normal)</text>

  <!-- Metric Card 2: ASCVD -->
  <rect x="210" y="80" width="180" height="100" rx="12" fill="#1E293B" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="225" y="105" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">10-YR ASCVD RISK</text>
  <text x="225" y="140" fill="#0EA5E9" font-family="sans-serif" font-size="22" font-weight="800">4.2%</text>
  <text x="225" y="162" fill="#94A3B8" font-family="sans-serif" font-size="10">Low Risk Tier</text>

  <!-- Metric Card 3: GFR -->
  <rect x="410" y="80" width="170" height="100" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="425" y="105" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">KIDNEY GFR</text>
  <text x="425" y="140" fill="#F59E0B" font-family="sans-serif" font-size="22" font-weight="800">95 mL/min</text>
  <text x="425" y="162" fill="#94A3B8" font-family="sans-serif" font-size="10">Normal Filtration</text>

  <!-- Main Chart Box -->
  <rect x="20" y="200" width="560" height="175" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="40" y="230" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="700">Vitals Telemetry Timeline</text>
  
  <!-- Grid Lines -->
  <line x1="40" y1="260" x2="540" y2="260" stroke="#334155" stroke-dasharray="4 4"/>
  <line x1="40" y1="300" x2="540" y2="300" stroke="#334155" stroke-dasharray="4 4"/>
  <line x1="40" y1="340" x2="540" y2="340" stroke="#334155"/>

  <!-- Waveform 1 (Systolic) -->
  <path d="M 40 290 Q 120 250, 200 280 T 360 260 T 540 270" fill="none" stroke="#10B981" stroke-width="3"/>
  
  <!-- Waveform 2 (Diastolic) -->
  <path d="M 40 320 Q 120 310, 200 330 T 360 310 T 540 325" fill="none" stroke="#0EA5E9" stroke-width="2.5" stroke-dasharray="2 2"/>

  <!-- Chart Points -->
  <circle cx="200" cy="280" r="5" fill="#10B981"/>
  <circle cx="360" cy="260" r="5" fill="#10B981"/>
  <circle cx="540" cy="270" r="5" fill="#10B981"/>
</svg>
